name: mobile-ios

# EXPERIMENTAL: kivy-ios currently builds CPython 3.11 while the project
# targets >= 3.13, so this job is continue-on-error until the toolchain
# catches up (or a custom python3 recipe is added). Android is the primary
# mobile target.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  MONOREPO_REPO: MultiworldGG/MultiworldGG-Beta
  MONOREPO_REF: main

jobs:
  ios-sim:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Checkout MultiworldGG monorepo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MONOREPO_REPO }}
          ref: ${{ env.MONOREPO_REF }}
          token: ${{ secrets.MWGG_MONOREPO_TOKEN || github.token }}
          path: MultiworldGG

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assemble vendor tree
        run: |
          pip install "git+https://github.com/MultiworldGG/MultiworldGG-Index@game_index_sixteen"
          MWGG_IGDB_PATH="$(python -c 'import mwgg_igdb; print(mwgg_igdb.__file__)')" \
            python mobile/sync_vendor.py --monorepo "$GITHUB_WORKSPACE/MultiworldGG/src"

      - name: Install brew deps
        run: brew install autoconf automake libtool pkg-config

      - name: Cache kivy-ios toolchain
        uses: actions/cache@v4
        with:
          path: mobile/ios/toolchain
          key: kivy-ios-${{ runner.os }}-${{ hashFiles('mobile/ios/build.sh') }}
          restore-keys: kivy-ios-${{ runner.os }}-

      - name: Build (simulator, unsigned)
        run: bash mobile/ios/build.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwgg-mobile-ios-sim
          path: mobile/ios/toolchain/mwggmobile-ios/build/**/*.app
          if-no-files-found: warn
