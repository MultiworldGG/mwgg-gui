[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
name = "mwgg_gui"
version = "0.4.0"
description = "GUI package for MultiworldGG"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [ "Private :: Do Not Upload",]
dependencies = [ "kivy>=2.3.1", "kivymd>=2.0.0", "pillow>=11.3.0", "asynckivy>=0.6.4", "numpy>=2.3.2", "pyshortcuts>=1.9.7",]
[[project.authors]]
name = "DelilahIsDidi"

[tool.setuptools.package-data]
mwgg_gui = [ "**/*.kv",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "mwgg_gui*",]
